plugins {
    id 'net.fabricmc.fabric-loom-remap' version "${loom_version}"
    id 'maven-publish'
}

version = project.mod_version
group = project.maven_group

repositories {
    mavenCentral()
}

loom {
    splitEnvironmentSourceSets()

    mods {
        "kfcudp" {
            sourceSet sourceSets.main
            sourceSet sourceSets.client
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
    modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

    // WebRTC Java — dev.onvoid.webrtc 0.14.0
    implementation 'dev.onvoid.webrtc:webrtc-java:0.14.0'
    implementation group: 'dev.onvoid.webrtc', name: 'webrtc-java', version: '0.14.0', classifier: 'windows-x86_64'
    implementation group: 'dev.onvoid.webrtc', name: 'webrtc-java', version: '0.14.0', classifier: 'linux-x86_64'
    implementation group: 'dev.onvoid.webrtc', name: 'webrtc-java', version: '0.14.0', classifier: 'macos-x86_64'
    implementation group: 'dev.onvoid.webrtc', name: 'webrtc-java', version: '0.14.0', classifier: 'macos-aarch64'

    // KCP Netty — 검증된 KCP Java 구현
    implementation 'io.jpower.kcp:kcp-netty:1.5.2'
}

processResources {
    def version = project.version
    inputs.property "version", version
    filesMatching("fabric.mod.json") {
        expand "version": version
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 21
}

java {
    withSourcesJar()
    sourceCompatibility = JavaVersion.VERSION_21
    targetCompatibility = JavaVersion.VERSION_21
}

jar {
    def projectName = project.name
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    inputs.property "projectName", projectName

    // webrtc-java 클래스 및 네이티브 라이브러리를 jar에 번들링
    // configurations.compileClasspath에서 webrtc 관련 jar만 추출
    from({
        configurations.compileClasspath.resolvedConfiguration.resolvedArtifacts
                .findAll { it.moduleVersion.id.group in ['dev.onvoid.webrtc', 'io.jpower.kcp'] }
                .collect { zipTree(it.file) }
    }) {
        exclude 'META-INF/*.SF'
        exclude 'META-INF/*.DSA'
        exclude 'META-INF/*.RSA'
        exclude 'META-INF/MANIFEST.MF'
    }

    from("LICENSE") {
        rename { "${it}_$projectName" }
    }
}

publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }
    repositories {}
}