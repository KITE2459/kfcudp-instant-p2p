# 버전 무관 공통 값(mod.*)은 여기, loader/loom 버전은 gradle.properties 참고.
# 버전별 값은 아래 [<version>] 테이블에.
mod.version = "1.0.13"
mod.group = "kfc.udp"

["1.21.5"]
deps.yarn = "1.21.5+build.1"
deps.fabric_api = "0.128.2+1.21.5"

["1.21.6"]
deps.yarn = "1.21.6+build.1"
deps.fabric_api = "0.128.2+1.21.6"

["1.21.7"]
deps.yarn = "1.21.7+build.8"
deps.fabric_api = "0.129.0+1.21.7"

["1.21.8"]
deps.yarn = "1.21.8+build.1"
deps.fabric_api = "0.136.1+1.21.8"

["1.21.9"]
deps.yarn = "1.21.9+build.1"
deps.fabric_api = "0.134.1+1.21.9"

["1.21.10"]
deps.yarn = "1.21.10+build.3"
deps.fabric_api = "0.138.4+1.21.10"

["1.21.11"]
deps.yarn = "1.21.11+build.6"
deps.fabric_api = "0.141.6+1.21.11"

# 26.x부터는 Minecraft가 완전히 언옵퓨스케이티드라 Yarn 자체가 없다(Mojang 공식 매핑을
# 그대로 씀) — deps.yarn이 없는 게 정상. loader_version(0.19.5)은 4개 버전이 전부
# 동일해서 build-26x.gradle.kts에 상수로 뒀다.
["26.1"]
deps.fabric_api = "0.145.1+26.1"

["26.1.1"]
deps.fabric_api = "0.145.4+26.1.1"

["26.1.2"]
deps.fabric_api = "0.155.2+26.1.2"

["26.2"]
deps.fabric_api = "0.159.0+26.2"
