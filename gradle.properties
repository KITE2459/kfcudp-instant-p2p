# Done to increase the memory available to gradle.
org.gradle.jvmargs=-Xmx8G
org.gradle.parallel=true

# IntelliJ IDEA is not yet fully compatible with configuration cache, see: https://github.com/FabricMC/fabric-loom/issues/1349
org.gradle.configuration-cache=false

# 버전 무관 공통 값 (모든 Stonecutter 노드에 공유됨). 버전별 값은 stonecutter.properties.toml 참고.
loader_version=0.18.4
loom_version=1.16-SNAPSHOT

# 26.x(언옵퓨스케이티드) 전용 — build-26x.gradle.kts가 참조. 4개 버전(26.1~26.2)이
# 전부 동일한 Loader를 요구해서 stonecutter.properties.toml이 아니라 여기 뒀다.
loader_version_26x=0.18.6
